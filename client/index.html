<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />

    <!-- ═══════════════════════════════════════════
         CORE META
    ═══════════════════════════════════════════ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PYPE ERM — Education Resource Management System | India</title>
    <meta name="description" content="PYPE ERM is a comprehensive Education Resource Management platform built for Indian educational institutions. Manage students, admissions, sales pipelines, HR, payroll, finance, and collections — all in one place." />
    <meta name="keywords" content="ERM, education management system, student management, admission management, school ERP India, college ERP, institute management software, HR management, payroll, collections, PYPE ERM" />
    <meta name="author" content="PYPE ERM" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0F172A" />
    <link rel="canonical" href="https://pypeerm.com/" />

    <!-- ═══════════════════════════════════════════
         GEO TARGETING (India)
    ═══════════════════════════════════════════ -->
    <meta name="geo.region" content="IN" />
    <meta name="geo.country" content="India" />
    <meta name="geo.placename" content="India" />
    <meta name="language" content="English" />
    <meta name="content-language" content="en-IN" />
    <meta name="revisit-after" content="7 days" />
    <meta name="rating" content="general" />
    <meta name="distribution" content="global" />
    <meta name="target" content="all" />

    <!-- ═══════════════════════════════════════════
         OPEN GRAPH (Facebook / LinkedIn / WhatsApp)
    ═══════════════════════════════════════════ -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pypeerm.com/" />
    <meta property="og:site_name" content="PYPE ERM" />
    <meta property="og:title" content="PYPE ERM — Education Resource Management System | India" />
    <meta property="og:description" content="Comprehensive Education Resource Management platform for Indian institutions. Manage students, admissions, HR, payroll, finance, and collections with ease." />
    <meta property="og:image" content="https://pypeerm.com/pype-logo.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="PYPE ERM Logo" />
    <meta property="og:locale" content="en_IN" />

    <!-- ═══════════════════════════════════════════
         TWITTER / X CARD
    ═══════════════════════════════════════════ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PYPE ERM — Education Resource Management System" />
    <meta name="twitter:description" content="All-in-one ERM platform for Indian educational institutions. Students, HR, Finance, Collections & more." />
    <meta name="twitter:image" content="https://pypeerm.com/pype-logo.png" />
    <meta name="twitter:image:alt" content="PYPE ERM" />

    <!-- ═══════════════════════════════════════════
         ICONS & PWA
    ═══════════════════════════════════════════ -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/pype-logo.png" />
    <link rel="apple-touch-icon" href="/pype-logo.png" />
    <meta name="application-name" content="PYPE ERM" />
    <meta name="apple-mobile-web-app-title" content="PYPE ERM" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- ═══════════════════════════════════════════
         PERFORMANCE HINTS
    ═══════════════════════════════════════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://pypeerm.com" />

    <!-- ═══════════════════════════════════════════
         STRUCTURED DATA — Organization (JSON-LD)
    ═══════════════════════════════════════════ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "PYPE ERM",
      "url": "https://pypeerm.com",
      "logo": "https://pypeerm.com/pype-logo.png",
      "description": "PYPE ERM is a comprehensive Education Resource Management platform for Indian educational institutions, enabling student management, admissions, HR, payroll, finance, sales pipelines, and collections.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "inLanguage": "en-IN",
      "offers": {
        "@type": "Offer",
        "priceCurrency": "INR",
        "availability": "https://schema.org/InStock"
      },
      "provider": {
        "@type": "Organization",
        "name": "PYPE ERM",
        "url": "https://pypeerm.com",
        "logo": "https://pypeerm.com/pype-logo.png",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "IN"
        }
      },
      "featureList": [
        "Student Admission Management",
        "Sales Pipeline & Lead Tracking",
        "HR & Payroll Management",
        "Fee & Payment Collections",
        "Finance Dashboard",
        "Study Centre Onboarding",
        "Performance Management",
        "Attendance Tracking"
      ]
    }
    </script>

    <!-- ═══════════════════════════════════════════
         THEME FLASH PREVENTION
    ═══════════════════════════════════════════ -->
    <script>
      (function() {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
